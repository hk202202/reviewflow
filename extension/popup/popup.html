<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; font-family: -apple-system, sans-serif; margin: 0; padding: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .logo-icon { width: 32px; height: 32px; background: #2563eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; }
    .logo-text { font-weight: 600; font-size: 14px; }
    .status { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
    .platform { background: #eff6ff; color: #2563eb; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
    .stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat { text-align: center; flex: 1; }
    .stat-value { font-size: 20px; font-weight: bold; }
    .stat-label { font-size: 10px; color: #6b7280; }
    .btn { display: block; width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; text-align: center; text-decoration: none; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="logo">
    <div class="logo-icon">RF</div>
    <div class="logo-text">ReviewFlow</div>
  </div>
  <div id="user-info" class="status">Loading...</div>
  <div id="platform-info" class="platform" style="display:none"></div>
  <select id="connection-select" style="display:none;width:100%;margin-bottom:8px;padding:6px;border-radius:6px;border:1px solid #e5e7eb;font-size:12px;"></select>
  <div class="stats">
    <div class="stat"><div class="stat-value" id="pending">—</div><div class="stat-label">Pending</div></div>
    <div class="stat"><div class="stat-value" id="published">—</div><div class="stat-label">Published</div></div>
  </div>
  <button id="import-btn" class="btn" style="margin-bottom:8px;background:#059669;">Import Reviews from Page</button>
  <div id="import-status" style="font-size:11px;color:#6b7280;margin-bottom:8px;"></div>
  <a href="http://localhost:3000/platforms" target="_blank" class="btn">Open Platforms</a>
  <script src="popup.js"></script>
</body>
</html>
